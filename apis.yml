name: Parla
description: Parla (originally launched as Adia) was a London-based digital reproductive-health
  startup that gave women access to at-home fertility blood tests, an AI-enabled fertility
  platform, educational content, and an expert-led peer community around conception, pregnancy,
  and loss. Backed by Seedcamp, Zinc VC, and other UK investors, Parla was acquired by
  Holland & Barrett International in April 2022; the myparla.com domain now redirects to
  hollandandbarrett.com and the company operates no independent public API, developer portal,
  or documentation surface.
